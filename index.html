<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>最后一步</title>
<style>
  :root{ --hue: 265; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{margin:0;height:100%;overflow:hidden;touch-action:manipulation;
    background:#0a0a14; color:#fff; overscroll-behavior:none;
    font-family:-apple-system,system-ui,"PingFang SC","Noto Sans SC",sans-serif}
  body{ display:flex; align-items:center; justify-content:center; }
  #bg{ position:fixed; inset:0; background:
      radial-gradient(120vw 80vh at 50% 0%, hsla(var(--hue),90%,55%,.22), transparent 60%),
      radial-gradient(100vw 70vh at 50% 100%, hsla(calc(var(--hue) + 60),90%,55%,.18), transparent 60%),
      #08080f;
      transition:background .8s ease; }
  .wrap{ position:relative; z-index:2; width:100%; max-width:420px; padding:24px; text-align:center }

  .badge{ display:inline-flex; gap:6px; align-items:center; font-size:12px; letter-spacing:.12em;
    color:#ffcf6a; border:1px solid rgba(255,207,106,.35); border-radius:999px;
    padding:5px 12px; margin-bottom:18px; background:rgba(255,207,106,.07) }
  h1{ font-size:26px; line-height:1.35; margin:0 0 10px; font-weight:800;
      letter-spacing:-.01em; min-height:70px; display:flex; align-items:center; justify-content:center }
  p.sub{ margin:0 0 26px; font-size:14px; line-height:1.7; color:#9aa3b8; min-height:44px }

  #btn{ position:relative; display:inline-block; border:0; cursor:pointer;
    font-size:19px; font-weight:800; color:#1a0b00; padding:16px 40px; border-radius:16px;
    background:linear-gradient(180deg,#ffd24a,#ff9d2e);
    box-shadow:0 10px 30px rgba(255,164,46,.35), inset 0 -4px 0 rgba(0,0,0,.18);
    transition:transform .12s ease, box-shadow .2s, padding .25s, font-size .25s, filter .3s }
  #btn:active{ transform:scale(.96); box-shadow:0 4px 14px rgba(255,164,46,.3) }
  #btn.spin{ filter:hue-rotate(40deg) }

  .meta{ margin-top:22px; font-size:12px; color:#5c6478; line-height:2 }
  .bar{ height:6px; border-radius:99px; background:rgba(255,255,255,.08); overflow:hidden; margin:18px auto 0; max-width:260px }
  .bar > i{ display:block; height:100%; width:0%; border-radius:99px;
    background:linear-gradient(90deg,#ffd24a,#ff5ea8); transition:width .5s cubic-bezier(.2,.8,.2,1) }

  #toast{ position:fixed; left:50%; bottom:12vh; transform:translate(-50%,20px); opacity:0;
    background:rgba(20,22,34,.94); border:1px solid rgba(255,255,255,.1);
    padding:11px 18px; border-radius:12px; font-size:14px; color:#e9edf7;
    transition:opacity .28s, transform .28s; pointer-events:none; z-index:9; max-width:82vw }
  #toast.on{ opacity:1; transform:translate(-50%,0) }

  .fx{ position:fixed; inset:0; pointer-events:none; z-index:5 }
  .dot{ position:absolute; width:8px; height:8px; border-radius:2px; will-change:transform,opacity }

  body.shake .wrap{ animation: shake .42s cubic-bezier(.36,.07,.19,.97) }
  @keyframes shake{
    10%,90%{ transform:translate3d(-2px,0,0) } 20%,80%{ transform:translate3d(4px,0,0) }
    30%,50%,70%{ transform:translate3d(-6px,0,0) } 40%,60%{ transform:translate3d(6px,0,0) }
  }
  .spin{ animation:spin 1s linear infinite }
  @keyframes spin{ to{ transform:rotate(360deg) } }
  #esc{ position:fixed; right:10px; bottom:10px; z-index:10; font-size:11px; color:#3a4052;
    background:none; border:0; padding:8px }

  /* 全屏遮罩层（第 10 次、第 15 次） */
  .veil{ position:fixed; inset:0; z-index:99999; display:none; opacity:0;
    background:#000; pointer-events:auto; touch-action:none;
    -webkit-user-select:none; user-select:none; transition:opacity .15s ease; }
  .veil.on{ display:block; opacity:1; }
  .veil.on.out{ opacity:0; transition:opacity 1.4s ease; }
  .veil img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
    display:block; pointer-events:none; -webkit-user-drag:none; }
  #msg{ background:radial-gradient(90vw 70vh at 50% 40%, rgba(255,210,74,.16), transparent 65%), #08080f; }
  #msg.on{ display:flex; align-items:center; justify-content:center; text-align:center; padding:28px; }
  #msg span{ display:block; font-weight:900; line-height:1.4; letter-spacing:.02em;
    font-size:clamp(30px,9.5vw,64px);
    background:linear-gradient(180deg,#fff3c4,#ffb02e); -webkit-background-clip:text;
    background-clip:text; color:transparent; filter:drop-shadow(0 6px 24px rgba(255,160,40,.35));
    animation:msgPop .55s cubic-bezier(.2,1.4,.4,1) both }
  @keyframes msgPop{ from{ transform:scale(.7); opacity:0 } to{ transform:scale(1); opacity:1 } }
</style>
</head>

  function toastMsg(msg){
    toast.textContent = msg;
    toast.classList.add('on');
    clearTimeout(toast._t);
    toast._t = setTimeout(function(){ toast.classList.remove('on'); }, 1700);
  }

  function buzz(ms){ if (navigator.vibrate) try{ navigator.vibrate(ms); }catch(e){} }

  function shake(){
    document.body.classList.remove('shake');
    void document.body.offsetWidth;
    document.body.classList.add('shake');
    setTimeout(function(){ document.body.classList.remove('shake'); }, 460);
  }

  // 彩色碎屑
  function confetti(){
    for (var k = 0; k < 26; k++){
      (function(){
        var d = document.createElement('i');
        d.className = 'dot';
        d.style.left = (40 + Math.random()*20) + '%';
        d.style.top  = '46%';
        d.style.background = 'hsl(' + (Math.random()*360) + ',90%,62%)';
        d.style.width = d.style.height = (5 + Math.random()*8) + 'px';
        fxBox.appendChild(d);
        var ang = (Math.random()*.9 - .45) * Math.PI;
        var sp  = 140 + Math.random()*260;
        var vx = Math.sin(ang) * sp, vy = -Math.cos(ang) * sp;
        var t0 = performance.now(), life = 900 + Math.random()*700;
        function step(now){
          var dt = (now - t0) / 1000;
          if (now - t0 > life){ d.remove(); return; }
          var y = vy*dt + 900*dt*dt;
          var x = vx*dt;
          d.style.transform = 'translate(' + x + 'px,' + y + 'px) rotate(' + (dt*540) + 'deg)';
          d.style.opacity = String(1 - (now - t0)/life);
          requestAnimationFrame(step);
        }
        requestAnimationFrame(step);
      })();
    }
  }

  function levelNum(n){
    // 让它无限循环但数字一直涨
    return Math.floor(n / STAGES.length) + 1;
  }

  function render(){
    var st = STAGES[i % STAGES.length];
    var n = Math.floor(i / STAGES.length) + 1;

    root.style.setProperty('--hue', String((265 + i * 17) % 360));

    title.textContent = st.t + (n > 1 ? ' · 第 ' + n + ' 轮' : '');
    sub.textContent   = st.s;
    btn.textContent   = st.b;

    // 各种逐步升级的小动作
    btn.style.padding = i > 9 ? '13px 28px' : '16px 40px';
    btn.style.fontSize = i > 9 ? '16px' : '19px';
    btn.style.transform = 'scale(' + Math.max(0.72, 1 - i * 0.012) + ')';
    btn.classList.toggle('spin', i % 7 === 5);

    var names = ['3', '3', '2', '2', '1', '1', '5', '5', '4', '4', '3'];
    badge.textContent = '● 限时 · 剩余名额 ' + names[i % names.length];

    bar.style.width = ((i * 13 + 7) % 97) + '%';
    meta.textContent = '你已点击 ' + clicks + ' 次 · 已有 ' + (1204331 + clicks * 7).toLocaleString() + ' 人领取';
  }

  var used1 = false, used2 = false;

  function veilOpen(){ return !!document.querySelector('.veil.on'); }

  // 全屏层出现时吞掉所有点击，什么都不让它点
  document.addEventListener('click', function(e){
    if (veilOpen()){ e.preventDefault(); e.stopPropagation(); }
  }, true);
  document.addEventListener('touchstart', function(e){
    if (veilOpen()){ e.preventDefault(); e.stopPropagation(); }
  }, {capture:true, passive:false});

  // 显示 holdMs，然后淡出 fadeMs，结束后回调
  function showVeil(el, holdMs, fadeMs, done){
    el.classList.add('on');
    setTimeout(function(){
      el.classList.add('out');
      setTimeout(function(){
        el.classList.remove('on');
        el.classList.remove('out');
        if (done) done();
      }, fadeMs + 80);
    }, holdMs);
  }

  function next(){
    if (locked) return;
    var st = STAGES[i % STAGES.length];
    clicks++;
    if (clicks === 10 && !used1){
      used1 = true; locked = true; toastMsg(st.x); buzz([30, 40, 30]);
      veilImg.src = veilImg.getAttribute('data-first') || veilImg.src;
      showVeil(veil, 2000, 1400, function(){ locked = false; i++; render(); });
      return;
    }
    if (clicks === 15 && !used2){
      used2 = true; locked = true; toastMsg(st.x); buzz([30, 40, 30]);
      veilImg.src = IMG2;
      showVeil(veil, 2000, 1400, function(){
        showVeil(msgBox, 2400, 900, function(){ locked = false; i++; render(); });
      });
      return;
    }
    toastMsg(st.x);
    buzz(st.e === 'shake' ? [30, 40, 30] : 18);

    if (st.e === 'shake') shake();
    if (st.e === 'confetti') confetti();
    if (st.e === 'progress'){
      bar.style.width = '99%';
      setTimeout(function(){ bar.style.width = '12%'; }, 700);
    }

    // 每 5 轮做一次假加载
    if (i > 0 && i % 11 === 10){
      locked = true;
      btn.textContent = '加载中…';
      setTimeout(function(){ locked = false; i++; render(); }, 1400);
      return;
    }

    i++;
    render();
  }

  btn.addEventListener('click', function(e){
    if (locked) return;
    // 后期按钮会小幅度躲一下，但仍然能点到
    if (i >= 6){
      var dx = (Math.random() - .5) * 26, dy = (Math.random() - .5) * 18;
      btn.style.transform = 'translate(' + dx + 'px,' + dy + 'px) scale(' + Math.max(0.72, 1 - i*0.012) + ')';
      setTimeout(function(){ btn.style.transform = 'scale(' + Math.max(0.72, 1 - i*0.012) + ')'; }, 180);
    }
    next();
  });

  // 按久了会自己连点，很烦，但忍住不加
  document.addEventListener('contextmenu', function(e){ e.preventDefault(); });

  // 逃生口：点 25 次以后出现，点了给一句实话
  var esc = document.getElementById('esc');
  esc.style.opacity = '0';
  esc.style.transition = 'opacity 1s';
  esc.addEventListener('click', function(){
    document.body.innerHTML =
      '<div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;' +
      'flex-direction:column;gap:14px;background:#0a0a14;text-align:center;padding:32px;' +
      'font-family:-apple-system,system-ui,sans-serif">' +
      '<div style="font-size:22px;font-weight:800;color:#ffd24a">你点了 ' + clicks + ' 次。</div>' +
      '<div style="font-size:14px;color:#8d97ad;line-height:1.8">没有奖励，没有中奖，也从来没有什么最后一步。<br>' +
      '这页面唯一的产出，是你自己按了 ' + clicks + ' 下。</div>' +
      '<div style="font-size:12px;color:#4b5266;margin-top:8px">刷新就能重来。</div></div>';
  });

  setInterval(function(){
    if (clicks >= 25) esc.style.opacity = '.75';
  }, 1000);

  render();
})();
</script>
